
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин товаров</title> <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Наш магазин</h1>
    <p>Каталог товаров</p>

    <form id="new-product">
        <h2>Новый товар</h2>
        <label>
            Название
            <input type="text" name="name" required>
        </label>
        <label>
            Цена
            <input type="number" name="price" min="0" step="0.01" required>
        </label>
        <label>
            Описание
            <input type="text" name="description" required>
        </label>
        <button type="submit">Добавить</button>
    </form>

    <div id="products"></div>

    <script src="script.js"></script>
</body>
</html>
