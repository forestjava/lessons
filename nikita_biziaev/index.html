<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Это веб страница на русском языке в кодировке UTF-8</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
  </head>
  <body>
    <button id="load-button" onClick="loadFromServer()">Загрузить текст с сервера</button>    
    <figure id="our-great-label" onClick="doSomething()" onMouseEnter="hide()">
      Привет, мир!  
    </figure>
    <div class="search-bar">
      <button type="button" class="search-bar__btn" aria-label="Добавить">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <input id="our-input" type="text" />
      <button type="button" class="search-bar__btn" aria-label="Голосовой ввод с микрофона">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3.5" width="6" height="10" rx="3" />
          <path d="M7.5 11.5a4.5 4.5 0 0 0 9 0M12 16v3.5M9 19.5h6" />
        </svg>
      </button>
      <button type="button" class="search-bar__btn" aria-label="Поиск по картинке">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="6" width="16" height="13" rx="3" />
          <circle cx="12" cy="12.5" r="3.2" />
          <path d="M9 6l1.2-2h3.6L15 6" />
        </svg>
      </button>
      <button type="button" class="search-bar__ai" aria-label="AI Mode">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6" />
          <path d="M15.5 15.5L20 20" />
          <path d="M19 5.2v2.6M17.7 6.5h2.6" />
        </svg>
        <span>AI Mode</span>
      </button>
    </div>
  </body>
</html>
